<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Geo Atlas" />
    <meta name="description" content="地形から“なぜ”を読み解く地球儀" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Geo Atlas</title>
  </head>
  <body>
    <div id="map" aria-label="地球儀"></div>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <nav class="toolbar" aria-label="地図操作">
      <button type="button" id="btn-globe" class="tool">
        <span class="tool-icon" aria-hidden="true">🌐</span>
        <span class="tool-label">地球儀</span>
      </button>
      <button type="button" id="btn-terrain" class="tool" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">⛰️</span>
        <span class="tool-label">3D地形</span>
      </button>
      <button type="button" id="btn-locate" class="tool">
        <span class="tool-icon" aria-hidden="true">📍</span>
        <span class="tool-label">現在地</span>
      </button>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
